<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Turni - Aviapartner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
    </script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2563eb;
            --success-color: #10b981;
            --border-color: #333;
            --error-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 650px; }
        h1 { font-size: 1.3rem; margin: 0 0 4px 0; text-align: center; color: #fff; }
        .subtitle { font-size: 0.8rem; text-align: center; color: #888; margin-bottom: 15px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #aaa; }
        input, select { width: 100%; padding: 10px; background-color: #2a2a2a; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.95rem; box-sizing: border-box; margin-bottom: 10px; }
        .btn { width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #1d4ed8; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-box { background-color: #262626; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; text-align: center; }
        .stat-value { font-size: 1.3rem; font-weight: bold; color: var(--success-color); margin-top: 2px; }
        .shift-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        .shift-table th, .shift-table td { border: 1px solid var(--border-color); padding: 8px 6px; text-align: center; }
        .shift-table th { background-color: #2a2a2a; color: #aaa; }
        .extra-input { width: 55px; padding: 4px; text-align: center; }
        #statusMessage { font-size: 0.85rem; color: #f59e0b; margin-top: 8px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestione Turni - Aviapartner</h1>
    <div class="subtitle">Strumento Universale per Tutti i Dipendenti</div>

    <div class="card">
        <label for="workerName">Inserisci il tuo Nome e Cognome</label>
        <input type="text" id="workerName" value="" placeholder="Es. ROCCHINI ANDREA">

        <label for="pdfFile">Carica il File PDF del Mese</label>
        <input type="file" id="pdfFile" accept="application/pdf">

        <button class="btn" onclick="leggiPDFUniversale()">Estrai Turni dal PDF</button>
        <div id="statusMessage">Inserisci il tuo nome, carica il PDF e premi il pulsante.</div>
    </div>

    <!-- MODIFICA MANUALE / STRAORDINARI -->
    <div class="card">
        <details>
            <summary style="cursor:pointer; font-weight:bold; color:#fff;">+ Modifica Turno o Aggiungi Straordinario</summary>
            <div style="margin-top:10px;">
                <label for="manualDate">Data (es. Dom 01/11)</label>
                <input type="text" id="manualDate" placeholder="Es. Dom 01/11">
                
                <label for="manualLabel">Orario Turno</label>
                <input type="text" id="manualLabel" value="08:00 - 16:00" placeholder="Es. 08:00 - 16:00, RIP">

                <label for="manualHours">Ore Ordinarie</label>
                <input type="number" id="manualHours" value="8" step="0.5">

                <label for="manualExtra">Straordinario (h)</label>
                <input type="number" id="manualExtra" value="0" step="0.5">

                <button class="btn" onclick="salvaModificaManuale()">Aggiorna Turno</button>
            </div>
        </details>
    </div>

    <!-- RIEPILOGO ORE -->
    <div class="card">
        <h3 style="margin:0; font-size:1rem; color:#fff;">Monte Ore Mensile</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div style="font-size:0.75rem; color:#aaa;">Ore Ordinarie</div>
                <div class="stat-value" id="totalBaseHours">0 h</div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.75rem; color:#aaa;">Totale + Straordinari</div>
                <div class="stat-value" id="totalFinalHours" style="color:#60a5fa;">0 h</div>
            </div>
        </div>

        <table class="shift-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Turno Reale</th>
                    <th>Ore</th>
                    <th>Extra</th>
                    <th>Totale</th>
                </tr>
            </thead>
            <tbody id="shiftTableBody">
                <tr><td colspan="5" style="color:#
