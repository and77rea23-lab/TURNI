<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Turni - Aviapartner</title>
    <!-- pdf.js con fallback di sicurezza -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #333;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0 0 4px 0;
            text-align: center;
            color: #fff;
        }
        .subtitle {
            font-size: 0.8rem;
            text-align: center;
            color: #888;
            margin-bottom: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .stat-box {
            background-color: #262626;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--success-color);
            margin-top: 2px;
        }
        .shift-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        .shift-table th, .shift-table td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
        }
        .shift-table th { background-color: #2a2a2a; color: #aaa; }
        .extra-input {
            width: 55px;
            padding: 4px;
            margin: 0;
            text-align: center;
        }
        .badge-riposo { color: #888; font-style: italic; }
        .badge-lavoro { color: #60a5fa; font-weight: bold; }
        #statusMessage {
            font-size: 0.85rem;
            color: var(--warning-color);
            margin-top: 8px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestione Turni - Aviapartner</h1>
    <div class="subtitle">Estrattore PDF & Calcolo Monte Ore</div>

    <!-- CARICAMENTO FILE PDF -->
    <div class="card">
        <label for="workerName">Nome e Cognome (esattamente come nel PDF)</label>
        <input type="text" id="workerName" value="Andrea Rocchini" placeholder="Es. Andrea Rocchini">

        <label for="pdfFile">Seleziona il PDF dei Turni Aziendali</label>
        <input type="file" id="pdfFile" accept="application/pdf">

        <button class="btn" onclick="analizzaPDFReale()">Estrai I Miei Turni Dal PDF</button>
        <div id="statusMessage">Carica il PDF e premi il pulsante.</div>
    </div>

    <!-- MODIFICA MANUALE E STRAORDINARI -->
    <div class="card">
        <details>
            <summary style="cursor:pointer; font-weight:bold; color:#fff;">+ Aggiungi o Modifica Turno / Straordinario</summary>
            <div style="margin-top:10px;">
                <label for="manualDate">Data o Giorno</label>
                <input type="text" id="manualDate" placeholder="Es. Giorno 01 oppure 2026-11-01">
                
                <label for="manualLabel">Descrizione Turno</label>
                <input type="text" id="manualLabel" value="Mattina (7h)" placeholder="Es. Mattina, Pomeriggio, Notte, Riposo">

                <label for="manualHours">Ore Ordinarie</label>
                <input type="number" id="manualHours" value="7" step="0.5">

                <label for="manualExtra">Straordinario (h)</label>
                <input type="number" id="manualExtra" value="0" step="0.5">

                <button class="btn" onclick="aggiungiModificaManuale()">Salva Modifica
