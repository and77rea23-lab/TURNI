<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Turni Reali - Aviapartner</title>
    <!-- pdf.js ufficiale -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #333;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0 0 4px 0;
            text-align: center;
            color: #fff;
        }
        .subtitle {
            font-size: 0.8rem;
            text-align: center;
            color: #888;
            margin-bottom: 15px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #aaa;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .stat-box {
            background-color: #262626;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--success-color);
            margin-top: 2px;
        }
        .shift-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        .shift-table th, .shift-table td {
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            text-align: center;
        }
        .shift-table th { background-color: #2a2a2a; color: #aaa; }
        .extra-input {
            width: 55px;
            padding: 4px;
            margin: 0;
            text-align: center;
        }
        .badge-riposo { color: #ef4444; font-weight: bold; }
        .badge-lavoro { color: #60a5fa; font-weight: bold; }
        #statusMessage {
            font-size: 0.85rem;
            color: var(--warning-color);
            margin-top: 8px;
            text-align: center;
            font-weight: bold;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>I Miei Turni - Aviapartner</h1>
    <div class="subtitle">Lettura Reale PDF & Calcolo Monte Ore</div>

    <!-- CARICAMENTO PDF -->
    <div class="card">
        <label for="workerName">Cognome o Nome (come a tabellone)</label>
        <input type="text" id="workerName" value="ROCCHINI" placeholder="Es. ROCCHINI">

        <label for="pdfFile">Seleziona il PDF dei Turni</label>
        <input type="file" id="pdfFile" accept="application/pdf">

        <button class="btn" onclick="estraiTurniReali()">Carica e Analizza PDF Reale</button>
        <div id="statusMessage">Seleziona il PDF aziendale per estrarre la tua turnazione.</div>
    </div>

    <!-- STRAORDINARI E AGGIUNTA MANUALE -->
    <div class="card">
        <details>
            <summary style="cursor:pointer; font-weight:bold; color:#fff;">+ Modifica Giorno o Aggiungi Straordinario</summary>
            <div style="margin-top:10px;">
                <label for="manualDate">Data o Giorno (es. Lun 01)</label>
                <input type="text" id="manualDate" placeholder="Es. Lun 01/11">
                
                <label for="manualLabel">Turno / Codice</label>
                <input type="text" id="manualLabel" value="07:00 - 14:00" placeholder="Es. RIP, 07:00 - 14:00, Notte">

                <label for="manualHours">Ore Ordinarie</label>
                <input type="number" id="manualHours" value="7" step="0.5">

                <label for="manualExtra">Ore Straordinario</label>
                <input type="number" id="manualExtra" value="0" step="0.5">

                <button class="btn" onclick="salvaModificaManuale()">Aggiorna Turno</button>
            </div>
        </details>
    </div>

    <!-- RIEPILOGO MESE -->
    <div class="card">
        <h3 style="margin:0; font-size:1rem; color:#fff;">Monte Ore Reale Calcolato</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div style="font-size:0.75rem; color:#aaa;">Ore Pianificate (Base)</div>
                <div class="stat-value" id="totalBaseHours">0 h</div>
            </div>
            <div class="stat-box">
                <div style="font-size:0.75rem; color:#aaa;">Totale + Straordinari</div>
                <div class="stat-value" id="totalFinalHours" style="color:#60a5fa;">0 h</div>
            </div>
        </div>

        <table class="shift-table">
            <thead>
                <tr>
                    <th>Giorno / Data</th>
                    <th>Turno Reale</th>
                    <th>Extra (h)
